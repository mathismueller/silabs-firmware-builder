name: Alphorn Gateway Zigbee NCP
device: EFR32MG24A020F1024IM40
base_project: src/zigbee_ncp
filename: "{manifest_name}_{ezsp_version}_{fw_variant}_{baudrate}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "gcc:14.2.1.20241119"

gbl:
  fw_type: zigbee_ncp
  ezsp_version: dynamic
  baudrate: 115200
  fw_variant: hw_flow

c_defines:
  # Zigbee Routing and Table Capacity
  SL_ZIGBEE_APS_UNICAST_MESSAGE_COUNT: 128
  SL_ZIGBEE_BINDING_TABLE_SIZE: 32
  SL_ZIGBEE_BROADCAST_TABLE_SIZE: 64
  SL_ZIGBEE_KEY_TABLE_SIZE: 12
  SL_ZIGBEE_MAX_END_DEVICE_CHILDREN: 32
  SL_ZIGBEE_SOURCE_ROUTE_TABLE_SIZE: 254
  SL_ZIGBEE_NEIGHBOR_TABLE_SIZE: 26
  SL_ZIGBEE_ADDRESS_TABLE_SIZE: 128
  SL_ZIGBEE_APS_DUPLICATE_REJECTION_MAX_ENTRIES: 64
  SL_ZIGBEE_PACKET_BUFFER_HEAP_SIZE: SL_ZIGBEE_HUGE_PACKET_BUFFER_HEAP

  SL_ZIGBEE_CHILD_TABLE_SIZE:
    type: c_flag
    value: 32

  SL_ZIGBEE_ROUTE_TABLE_SIZE:
    type: c_flag
    value: 254

  SL_ZIGBEE_MULTICAST_TABLE_SIZE:
    type: c_flag
    value: 26

  SL_ZIGBEE_DISCOVERY_TABLE_SIZE:
    type: c_flag
    value: 16

  # Clock Tree (Verified 39.0 MHz HFXO from factory binary and CTUNE 140)
  SL_CLOCK_MANAGER_HFXO_FREQ: 39000000
  SL_CLOCK_MANAGER_HFXO_PRECISION: 10
  SL_CLOCK_MANAGER_HFXO_CTUNE: 140

  # Serial Interface (EUSART0, 115200 8N1, Hardware Flow Control on PA0/PA6/PA7/PA8)
  SL_IOSTREAM_EUSART_VCOM_BAUDRATE: 115200
  SL_IOSTREAM_EUSART_VCOM_FLOW_CONTROL_TYPE: SL_IOSTREAM_EUSART_UART_FLOW_CTRL_CTS_RTS
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL: EUSART0
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL_NO: 0
  SL_IOSTREAM_EUSART_VCOM_TX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_TX_PIN:  8
  SL_IOSTREAM_EUSART_VCOM_RX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_RX_PIN:  7
  SL_IOSTREAM_EUSART_VCOM_CTS_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_CTS_PIN:  6
  SL_IOSTREAM_EUSART_VCOM_RTS_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_RTS_PIN:  0
  SL_IOSTREAM_EUSART_VCOM_RX_BUFFER_SIZE: 512
